name: AURA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract AURA Android project
        run: |
          unzip -q AURA-Android-Native-Layer.zip -d source

      - name: Build Debug APK
        run: |
          gradle -p source/aura-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-APK
          path: source/aura-android/app/build/outputs/apk/debug/app-debug.apk
